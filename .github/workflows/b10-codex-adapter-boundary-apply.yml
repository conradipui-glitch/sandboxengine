name: B10 Codex Adapter Boundary Apply

on:
  push:
    branches:
      - b10-author-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply Codex adapter boundary patch
        run: python scripts/b10-codex-adapter-boundary-sync.py
      - name: Typecheck
        run: npm run typecheck
      - name: AI regressions
        run: npm run test:ai
      - name: Boundary gate
        run: npm run check:boundaries
      - name: Docs gate
        run: npm run docs:check
      - name: Diff gate
        run: git diff --check -- packages/ai/src/codex-app-server-backend.ts packages/ai/src/index.ts packages/ai/test/codex-app-server-backend.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-codex-adapter-boundary.md
      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/b10-codex-adapter-boundary-sync.py .github/workflows/b10-codex-adapter-boundary-apply.yml
          git add packages/ai/src/codex-app-server-backend.ts packages/ai/src/index.ts packages/ai/test/codex-app-server-backend.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-codex-adapter-boundary.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(B10): add Codex App Server adapter boundary"
          git push origin HEAD:b10-author-assistant
