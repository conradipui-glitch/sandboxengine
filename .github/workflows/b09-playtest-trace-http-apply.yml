name: B09 Playtest Trace HTTP Apply

on:
  push:
    branches:
      - b09-03-version-history-studio-access

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b09-03-version-history-studio-access
          fetch-depth: 0
      - name: Apply playtest trace HTTP patch
        run: python scripts/b09-playtest-trace-http-sync.py
      - name: Remove staging files
        run: |
          rm scripts/b09-playtest-trace-http-sync.py
          rm .github/workflows/b09-playtest-trace-http-apply.yml
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(B09-03): expose persisted playtest trace evidence"
          git push origin HEAD:b09-03-version-history-studio-access
