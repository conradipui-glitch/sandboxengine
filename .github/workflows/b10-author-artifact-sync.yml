name: B10 author artifact sync
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-author-artifact-sync.mjs
      - .github/workflows/b10-author-artifact-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply bounded artifact patch
        run: node scripts/b10-author-artifact-sync.mjs
      - name: Remove staging artifacts
        run: rm scripts/b10-author-artifact-sync.mjs .github/workflows/b10-author-artifact-sync.yml
      - name: Verify patch hygiene
        run: |
          grep -q 'readonly artifacts: AuthorAgentProposalArtifactStore' apps/server/src/author-assistant.ts
          test ! -e scripts/b10-author-artifact-sync.mjs
          test ! -e .github/workflows/b10-author-artifact-sync.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/author-assistant.ts scripts/b10-author-artifact-sync.mjs .github/workflows/b10-author-artifact-sync.yml
          git commit -m "feat(B10): resume author segments from durable proposal artifacts"
          git push origin HEAD:b10-author-assistant
