name: B10 Studio author UI import fix
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-studio-author-ui-import-fix.mjs
      - .github/workflows/b10-studio-author-ui-import-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply exact import fix
        run: node scripts/b10-studio-author-ui-import-fix.mjs
      - name: Remove staging artifacts
        run: rm scripts/b10-studio-author-ui-import-fix.mjs .github/workflows/b10-studio-author-ui-import-fix.yml
      - name: Verify patch hygiene
        run: |
          grep -q '../dist/src/author-assistant.js' apps/studio/test/author-assistant-ui.test.mjs
          test ! -e scripts/b10-studio-author-ui-import-fix.mjs
          test ! -e .github/workflows/b10-studio-author-ui-import-fix.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/test/author-assistant-ui.test.mjs scripts/b10-studio-author-ui-import-fix.mjs .github/workflows/b10-studio-author-ui-import-fix.yml
          git commit -m "fix(B10): load compiled Studio author assistant module in tests"
          git push origin HEAD:b10-author-assistant
