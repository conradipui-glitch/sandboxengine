name: B09 Studio Access Mutations Apply

on:
  push:
    branches:
      - b09-03-version-history-studio-access

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b09-03-version-history-studio-access
      - run: python scripts/b09-studio-access-mutations-sync.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/api.ts apps/studio/src/access.ts apps/studio/src/app.ts apps/studio/styles.css
          git rm scripts/b09-studio-access-mutations-sync.py .github/workflows/b09-studio-access-mutations-apply.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(B09-03): enable owner member role mutations in Studio"
          git push origin HEAD:b09-03-version-history-studio-access
