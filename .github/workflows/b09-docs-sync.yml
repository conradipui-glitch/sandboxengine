name: B09 Docs Sync

on:
  push:
    branches: [b09-03-version-history-studio-access]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b09-03-version-history-studio-access
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Regenerate deterministic agent docs
        run: node scripts/docs-generate.mjs
      - name: Commit generated docs if changed
        shell: bash
        run: |
          if git diff --quiet -- docs/agent; then
            echo "Generated docs already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent
          git commit -m "docs(B09-03): regenerate agent contracts"
          git push origin HEAD:b09-03-version-history-studio-access
