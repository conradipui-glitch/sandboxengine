name: B10 author job discovery sync
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-author-job-discovery-sync.mjs
      - .github/workflows/b10-author-job-discovery-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply durable job discovery
        run: node scripts/b10-author-job-discovery-sync.mjs
      - name: Remove staging artifacts
        run: rm scripts/b10-author-job-discovery-sync.mjs .github/workflows/b10-author-job-discovery-sync.yml
      - name: Verify patch hygiene
        run: |
          grep -q 'listJobs(projectId' packages/control/src/author-agent-jobs.ts
          grep -q 'context.method === "GET"' apps/server/src/author-job-http.ts
          test ! -e scripts/b10-author-job-discovery-sync.mjs
          test ! -e .github/workflows/b10-author-job-discovery-sync.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/control/src/author-agent-jobs.ts apps/server/src/author-job-http.ts apps/server/test/author-job-http.test.mjs scripts/b10-author-job-discovery-sync.mjs .github/workflows/b10-author-job-discovery-sync.yml
          git commit -m "feat(B10): discover persistent author jobs after reload"
          git push origin HEAD:b10-author-assistant
