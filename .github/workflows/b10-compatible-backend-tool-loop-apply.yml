name: B10 Compatible Backend Tool Loop Apply

on:
  push:
    branches:
      - b10-author-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply compatible backend tool-loop patch
        run: |
          python scripts/b10-compatible-backend-tool-loop-sync.py
          python scripts/b10-compatible-backend-tool-loop-fix.py
      - name: Typecheck
        run: npm run typecheck
      - name: Control regressions
        run: npm run test:control
      - name: Server regressions
        run: npm run test:server
      - name: Boundary gate
        run: npm run check:boundaries
      - name: Docs gate
        run: npm run docs:check
      - name: Diff gate
        run: git diff --check -- packages/control/src/author-agent-jobs.ts apps/server/src/author-mcp.ts apps/server/src/author-tool-loop.ts apps/server/src/author-backend-tool-protocol.ts apps/server/src/author-assistant.ts apps/server/test/author-backend-tool-protocol.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-compatible-backend-tool-loop.md
      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/b10-compatible-backend-tool-loop-sync.py scripts/b10-compatible-backend-tool-loop-fix.py .github/workflows/b10-compatible-backend-tool-loop-apply.yml
          git add packages/control/src/author-agent-jobs.ts apps/server/src/author-mcp.ts apps/server/src/author-tool-loop.ts apps/server/src/author-backend-tool-protocol.ts apps/server/src/author-assistant.ts apps/server/test/author-backend-tool-protocol.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-compatible-backend-tool-loop.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(B10): add compatible backend tool loop"
          git push origin HEAD:b10-author-assistant
