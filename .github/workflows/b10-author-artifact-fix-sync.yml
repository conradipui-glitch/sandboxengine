name: B10 author artifact fix sync
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-author-artifact-fix-sync.mjs
      - .github/workflows/b10-author-artifact-fix-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply bounded fixes
        run: node scripts/b10-author-artifact-fix-sync.mjs
      - name: Remove staging artifacts
        run: rm scripts/b10-author-artifact-fix-sync.mjs .github/workflows/b10-author-artifact-fix-sync.yml
      - name: Verify patch hygiene
        run: |
          grep -q 'proposalId,$' apps/server/src/author-assistant.ts
          grep -q 'MemoryAuthorAgentProposalArtifactStore' apps/server/test/author-assistant.test.mjs
          test ! -e scripts/b10-author-artifact-fix-sync.mjs
          test ! -e .github/workflows/b10-author-artifact-fix-sync.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/author-assistant.ts apps/server/test/author-assistant.test.mjs packages/control/src/author-agent-artifacts.ts scripts/b10-author-artifact-fix-sync.mjs .github/workflows/b10-author-artifact-fix-sync.yml
          git commit -m "fix(B10): harden durable author artifact replay"
          git push origin HEAD:b10-author-assistant
