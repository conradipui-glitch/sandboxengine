name: B10 External Task Package Apply

on:
  push:
    branches:
      - b10-author-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply external task package patch
        run: python scripts/b10-external-task-package-sync.py
      - name: Regenerate installed agent kit
        run: npm run docs:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Contracts regressions
        run: npm run test:contracts
      - name: Server regressions
        run: npm run test:server
      - name: Boundary gate
        run: npm run check:boundaries
      - name: Docs gate
        run: npm run docs:check
      - name: Diff gate
        run: git diff --check -- apps/server/src/author-task-package.ts apps/server/src/author-job-http.ts apps/server/test/author-task-package.test.mjs packages/contracts/registry/endpoints.json docs/agent docs/worklog/2026-09-08-b10-external-task-package.md
      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/b10-external-task-package-sync.py .github/workflows/b10-external-task-package-apply.yml
          git add apps/server/src/author-task-package.ts apps/server/src/author-job-http.ts apps/server/test/author-task-package.test.mjs packages/contracts/registry/endpoints.json docs/agent docs/worklog/2026-09-08-b10-external-task-package.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(B10): export external task packages"
          git push origin HEAD:b10-author-assistant
