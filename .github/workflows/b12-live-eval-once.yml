name: B12 live provider eval once

on:
  push:
    branches:
      - b12-release-hardening
    paths:
      - .github/workflows/b12-live-eval-once.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # Replace only these two empty values in GitHub UI before the release eval run.
  LHE_EVAL_API_KEY: ""
  LHE_EVAL_MODEL: ""
  LHE_EVAL_OUTPUT: /tmp/b12-live-eval.json

jobs:
  live-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run typecheck
      - name: Run bounded live eval
        shell: bash
        run: |
          set -euo pipefail
          node scripts/eval-ai.mjs >/tmp/b12-live-eval.stdout
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('/tmp/b12-live-eval.json', 'utf8'));
          if (report.status !== 'completed') {
            console.error(JSON.stringify({ gate: 'B12.4-live-provider', status: report.status, provider: report.provider, model: report.model, reason: report.reason ?? null }));
            process.exit(1);
          }
          const cases = report.cases.map((entry) => ({
            id: entry.id,
            kind: entry.kind,
            contractPass: entry.contractPass,
            semanticPass: entry.semanticPass,
            latencyMs: entry.latencyMs,
            attempts: entry.attempts,
            usage: entry.usage,
            modelId: entry.modelId,
            providerRequestIds: entry.providerRequestIds
          }));
          const totalAttempts = cases.reduce((sum, entry) => sum + entry.attempts, 0);
          const latencies = cases.map((entry) => entry.latencyMs).filter(Number.isFinite);
          const totalTokens = cases.reduce((sum, entry) => sum + (entry.usage?.totalTokens ?? 0), 0);
          const usageComplete = cases.every((entry) => entry.usage?.totalTokens !== null);
          const summary = {
            gate: 'B12.4-live-provider',
            status: report.status,
            observedAt: report.observedAt,
            provider: report.provider,
            model: report.model,
            summary: report.summary,
            totalAttempts,
            totalTokens: usageComplete ? totalTokens : null,
            meanLatencyMs: latencies.length ? Math.round(latencies.reduce((a,b)=>a+b,0)/latencies.length) : null,
            maxLatencyMs: latencies.length ? Math.max(...latencies) : null,
            cases
          };
          console.log(JSON.stringify(summary));
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '# B12.4 live provider eval',
            '',
            `- Provider: ${report.provider}`,
            `- Model: ${report.model}`,
            `- Cases: ${report.summary.cases}`,
            `- Contract: ${report.summary.contractPassed}/${report.summary.cases} (${(report.summary.contractRate * 100).toFixed(1)}%)`,
            `- Semantic: ${report.summary.semanticPassed}/${report.summary.semanticScored} (${(report.summary.semanticRate * 100).toFixed(1)}%)`,
            `- Attempts: ${totalAttempts}`,
            `- Total tokens: ${usageComplete ? totalTokens : 'provider did not report complete usage'}`,
            `- Mean latency: ${summary.meanLatencyMs ?? 'n/a'} ms`,
            `- Max latency: ${summary.maxLatencyMs ?? 'n/a'} ms`,
            ''
          ].join('\n'));
          if (report.summary.contractPassed !== report.summary.cases) {
            console.error('B12.4 blocker: one or more live cases violated the structural contract');
            process.exit(2);
          }
          NODE
