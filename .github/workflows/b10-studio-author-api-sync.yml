name: B10 Studio author API sync
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-studio-author-api-sync.mjs
      - .github/workflows/b10-studio-author-api-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply Studio author API client
        run: node scripts/b10-studio-author-api-sync.mjs
      - name: Remove staging artifacts
        run: rm scripts/b10-studio-author-api-sync.mjs .github/workflows/b10-studio-author-api-sync.yml
      - name: Verify patch hygiene
        run: |
          grep -q 'listAuthorJobs' apps/studio/src/api.ts
          grep -q 'applyAuthoringProposal' apps/studio/src/api.ts
          test ! -e scripts/b10-studio-author-api-sync.mjs
          test ! -e .github/workflows/b10-studio-author-api-sync.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/api.ts scripts/b10-studio-author-api-sync.mjs .github/workflows/b10-studio-author-api-sync.yml
          git commit -m "feat(B10): expose author assistant through Studio API client"
          git push origin HEAD:b10-author-assistant
