name: B10 Closure Acceptance Apply

on:
  push:
    branches:
      - b10-author-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply B10 closure patch
        run: python scripts/b10-closure-audit-sync.py
      - name: Typecheck
        run: npm run typecheck
      - name: Studio regressions
        run: npm run test:studio
      - name: Server regressions
        run: npm run test:server
      - name: AI regressions
        run: npm run test:ai
      - name: Boundary gate
        run: npm run check:boundaries
      - name: Docs gate
        run: npm run docs:check
      - name: Diff gate
        run: git diff --check -- apps/studio/test/b10-full-author-assistant-cycle.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-semantic-audit.md
      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/b10-closure-audit-sync.py .github/workflows/b10-closure-audit-apply.yml
          git add apps/studio/test/b10-full-author-assistant-cycle.test.mjs docs/tasks/B10-author-assistant.md docs/worklog/2026-09-08-b10-semantic-audit.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(B10): close full author assistant acceptance"
          git push origin HEAD:b10-author-assistant
