name: B10.b.9 bounded context rerun
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-b9-bounded-context-run.py
      - .github/workflows/b10-b9-bounded-context-run.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply bounded author context selector
        run: python3 scripts/b10-b9-bounded-context-run.py
      - name: Remove all bounded-context staging artifacts
        run: rm scripts/b10-b9-bounded-context-sync.py scripts/b10-b9-bounded-context-run.py .github/workflows/b10-b9-bounded-context-sync.yml .github/workflows/b10-b9-bounded-context-run.yml
      - name: Verify patch hygiene
        run: |
          test -f packages/control/src/author-context.ts
          test -f packages/control/test/author-context.test.mjs
          test -f packages/control/test/author-context-checkpoint.test.mjs
          test -f apps/server/src/author-context-catalog.ts
          test -f apps/server/test/author-context-selection.test.mjs
          grep -q 'context.selected' packages/control/src/author-agent-jobs.ts
          grep -q 'Bounded quest authoring context' apps/server/src/author-assistant.ts
          grep -q 'buildInstalledAuthorContextCapabilityCatalog' apps/server/src/control-server.ts
          test ! -e scripts/b10-b9-bounded-context-sync.py
          test ! -e scripts/b10-b9-bounded-context-run.py
          test ! -e .github/workflows/b10-b9-bounded-context-sync.yml
          test ! -e .github/workflows/b10-b9-bounded-context-run.yml
      - name: Commit production bounded context slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(B10): select bounded author context"
          git push origin HEAD:b10-author-assistant
