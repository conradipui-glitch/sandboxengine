name: B10 Agent Kit Recipes Apply

on:
  push:
    branches:
      - b10-author-assistant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply checked recipe patch
        run: |
          python scripts/b10-agent-kit-recipes-test-fix.py
          python scripts/b10-b10-agent-kit-recipes-sync.py
          npm run docs:generate
      - name: Targeted gate
        run: |
          npm run typecheck
          npm run test:contracts
          npm run test:server
          npm run docs:check
          git diff --check -- scripts/generated-docs.mjs apps/server/src/agent-kit.ts packages/contracts/test/generated-docs.test.mjs apps/server/test/authoring-proposal-http.test.mjs docs/agent
      - name: Commit clean production tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/b10-b10-agent-kit-recipes-sync.py scripts/b10-agent-kit-recipes-test-fix.py .github/workflows/b10-agent-kit-recipes-apply.yml
          git add scripts/generated-docs.mjs apps/server/src/agent-kit.ts packages/contracts/test/generated-docs.test.mjs apps/server/test/authoring-proposal-http.test.mjs docs/agent
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(B10): add checked agent kit recipes"
          git push origin HEAD:b10-author-assistant
