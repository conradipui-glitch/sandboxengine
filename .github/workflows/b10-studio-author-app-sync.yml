name: B10 Studio author app sync
on:
  push:
    branches: [b10-author-assistant]
    paths:
      - scripts/b10-studio-author-app-sync.mjs
      - scripts/b10-studio-author-app-sync.py
      - .github/workflows/b10-studio-author-app-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b10-author-assistant
      - name: Apply bounded Studio assistant integration
        run: python3 scripts/b10-studio-author-app-sync.py
      - name: Remove staging artifacts
        run: rm scripts/b10-studio-author-app-sync.mjs scripts/b10-studio-author-app-sync.py .github/workflows/b10-studio-author-app-sync.yml
      - name: Verify patch hygiene
        run: |
          grep -q 'renderAuthorAssistantPanel(this.state.authorAssistant' apps/studio/src/app.ts
          grep -q 'studio-dev-scripted-author' apps/studio/src/main.ts
          grep -q '@living-history/ai' apps/studio/tsconfig.json
          grep -q 'B10.a Author Assistant' apps/studio/styles.css
          test -f apps/studio/test/author-assistant-app.test.mjs
          test ! -e scripts/b10-studio-author-app-sync.mjs
          test ! -e scripts/b10-studio-author-app-sync.py
          test ! -e .github/workflows/b10-studio-author-app-sync.yml
      - name: Commit production diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app.ts apps/studio/src/author-assistant.ts apps/studio/src/main.ts apps/studio/styles.css apps/studio/tsconfig.json apps/studio/test/author-assistant-app.test.mjs scripts/b10-studio-author-app-sync.mjs scripts/b10-studio-author-app-sync.py .github/workflows/b10-studio-author-app-sync.yml
          git commit -m "feat(B10): wire persistent Author Assistant into Studio"
          git push origin HEAD:b10-author-assistant
