name: B12 T29 mobile browser smoke

on:
  push:
    branches: [b12-release-hardening]
    paths:
      - .github/workflows/b12-t29-browser-smoke.yml

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install one-shot browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start real Studio
        run: |
          npm run dev:studio > /tmp/lh-studio.log 2>&1 &
          echo $! > /tmp/lh-studio.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Studio ready on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lh-studio.log
          exit 1

      - name: Exercise T29 at 360x800
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const httpFailures = [];
          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('response', (response) => {
            if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
          });

          try {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('.studio-shell').waitFor();
            await page.locator('#studio-onboarding-layer').waitFor({ state: 'attached' });

            const firstTour = page.locator('.lh-tour-card');
            await firstTour.waitFor();

            const layout = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth
            }));
            assert.equal(layout.innerWidth, 360);
            assert.ok(layout.scrollWidth <= 360, `document horizontal overflow: ${layout.scrollWidth}`);
            assert.ok(layout.bodyScrollWidth <= 360, `body horizontal overflow: ${layout.bodyScrollWidth}`);

            assert.match(await firstTour.innerText(), /шаг 1 из 8/i);
            await page.locator('[data-onboarding-action="tour-skip"]').click();
            await firstTour.waitFor({ state: 'detached' });

            const title = page.locator('form[data-form="project"] input[name="title"]');
            await title.waitFor();
            const box = await title.boundingBox();
            assert.ok(box, 'project title input has no bounding box');
            assert.ok(box.x >= 0 && box.x + box.width <= 360, `project title input clipped: ${JSON.stringify(box)}`);

            await title.focus();
            await page.keyboard.type('Mobile keyboard proof');
            assert.equal(await title.inputValue(), 'Mobile keyboard proof');
            assert.equal(await title.evaluate((element) => document.activeElement === element), true);

            await page.locator('#studio-help-trigger').click();
            const help = page.locator('.lh-help-dialog');
            await help.waitFor();
            assert.equal(await help.evaluate((element) => element.contains(document.activeElement)), true, 'help did not move focus into dialog');
            assert.equal(await title.inputValue(), 'Mobile keyboard proof', 'help interaction changed form input');

            await page.keyboard.press('Escape');
            await help.waitFor({ state: 'detached' });
            await page.waitForFunction(() => document.activeElement?.id === 'studio-help-trigger');
            assert.equal(await title.inputValue(), 'Mobile keyboard proof', 'Escape/help close changed form input');

            await page.locator('#studio-help-trigger').click();
            await page.locator('[data-onboarding-action="repeat-tour"]').click();
            const replay = page.locator('.lh-tour-card');
            await replay.waitFor();
            assert.match(await replay.innerText(), /шаг 1 из 8/i);
            await page.locator('[data-onboarding-action="tour-next"]').click();
            assert.match(await replay.innerText(), /шаг 2 из 8/i);
            await page.locator('[data-onboarding-action="tour-back"]').click();
            assert.match(await replay.innerText(), /шаг 1 из 8/i);
            await page.locator('[data-onboarding-action="tour-skip"]').click();
            await replay.waitFor({ state: 'detached' });

            assert.equal(await title.inputValue(), 'Mobile keyboard proof', 'tour replay changed form input');
            assert.deepEqual(pageErrors, [], `page errors: ${pageErrors.join(' | ')}`);

            const expectedLocalAuthProbe = (entry) => {
              try {
                const url = new URL(entry.url);
                return entry.status === 404 && url.pathname === '/control/v1/auth/session';
              } catch {
                return false;
              }
            };
            const expectedFavicon = (entry) => {
              try { return entry.status === 404 && new URL(entry.url).pathname === '/favicon.ico'; }
              catch { return false; }
            };
            const unexpectedHttp = httpFailures.filter((entry) => !expectedLocalAuthProbe(entry) && !expectedFavicon(entry));
            assert.deepEqual(unexpectedHttp, [], `unexpected HTTP failures: ${JSON.stringify(unexpectedHttp)}`);
            assert.equal(httpFailures.some(expectedLocalAuthProbe), true, 'local Studio must expose the canonical 404 auth probe used to select local-owner mode');

            const resource404Count = httpFailures.filter((entry) => entry.status === 404).length;
            const generic404ConsoleCount = consoleErrors.filter((message) => /^Failed to load resource: the server responded with a status of 404 \(Not Found\)$/.test(message)).length;
            assert.ok(generic404ConsoleCount <= resource404Count, `unmatched console 404 errors: ${JSON.stringify(consoleErrors)}`);
            const nonResourceConsoleErrors = consoleErrors.filter((message) => !/^Failed to load resource: the server responded with a status of 404 \(Not Found\)$/.test(message));
            assert.deepEqual(nonResourceConsoleErrors, [], `console errors: ${nonResourceConsoleErrors.join(' | ')}`);

            console.log('B12_T29_BROWSER_SMOKE=' + JSON.stringify({
              result: 'pass',
              viewport: '360x800',
              horizontalOverflow: false,
              onboarding: ['auto-start', 'skip', 'help', 'escape-focus-return', 'replay', 'next', 'back', 'skip'],
              editableControl: 'project-title',
              keyboardInputPreserved: true,
              pageErrors: 0,
              unexpectedHttpFailures: 0,
              canonicalLocalAuthProbe404: true,
              favicon404Observed: httpFailures.some(expectedFavicon)
            }));
          } finally {
            await browser.close();
          }
          NODE

      - name: Show Studio log on failure
        if: failure()
        run: cat /tmp/lh-studio.log || true

      - name: Stop Studio
        if: always()
        run: |
          if [ -f /tmp/lh-studio.pid ]; then
            kill "$(cat /tmp/lh-studio.pid)" || true
          fi
