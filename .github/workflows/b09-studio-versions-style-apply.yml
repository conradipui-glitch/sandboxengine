name: B09 Studio Versions Style Apply

on:
  push:
    branches:
      - b09-03-version-history-studio-access

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b09-03-version-history-studio-access
      - run: python scripts/b09-studio-versions-style-sync.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "style(B09-03): present Studio Versions read model"
          git push origin HEAD:b09-03-version-history-studio-access
