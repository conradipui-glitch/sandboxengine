# Studio + Player + gate behind Telegram auth; Engine API is public (token-authenticated by app BFF)
server {
    listen 8741 ssl;
    listen [::]:8741 ssl;
    server_name 85.137.95.104.sslip.io;

    ssl_certificate /etc/letsencrypt/live/85.137.95.104.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/85.137.95.104.sslip.io/privkey.pem;
    client_max_body_size 2m;

    # Gate endpoints are public (invite flow + Telegram callback + health)
    location /gate/ {
        proxy_pass http://127.0.0.1:8744;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Studio: authenticated via lhc-gate session cookie.
    # The Studio product boundary is loopback-only by design (L01); nginx normalizes
    # Host/Origin to the loopback form so the internal policy accepts proxied traffic.
    # Unauthenticated visitors never reach this block (auth_request below).
    location / {
        auth_request /_gate_check;
        error_page 401 = @gate_login;
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8740;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-LHC-Telegram-Id $auth_telegram_id;
        proxy_read_timeout 300s;
    }

    # Player surface + runtime API: Player assets and /v1/* are served by the
    # Player dev server (one active playtest; auth required the same way).
    location ~ ^/p/(?<player_id>[A-Za-z0-9_-]+)(?<player_rest>/.*)?$ {
        auth_request /_gate_check;
        error_page 401 = @gate_login;
        proxy_pass http://127.0.0.1:8745$player_rest;
        include /etc/nginx/conf.d/lhc-player-proxy.inc;
    }

    location ~ ^/(v1/|player-meta\.json|player-lib/|app\.js|styles\.css)$ {
        auth_request /_gate_check;
        error_page 401 = @gate_login;
        proxy_pass http://127.0.0.1:8745;
        include /etc/nginx/conf.d/lhc-player-proxy.inc;
    }

    location = /_gate_check {
        internal;
        proxy_pass http://127.0.0.1:8744/gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        auth_request_set $auth_telegram_id $upstream_http_x_telegram_id;
    }

    location @gate_login {
        default_type text/html;
        return 200 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Living History — вход</title><body style="font-family:system-ui;background:#12110f;color:#eee;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h2>Вход в Living History Studio</h2><p>Подтвердите вход через Telegram</p><div id="tg"></div><script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="glmbot_bot" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"></script><script>window.onTelegramAuth=(u)=>{fetch("/gate/callback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...u,invite:new URLSearchParams(location.search).get("invite")})}).then(r=>r.json()).then(j=>{if(j.setCookie){document.cookie=j.setCookie;location.href="/";}})};</script></div></body>';
    }
}
