# Studio + Player + gate behind Telegram auth; Engine API is public (token-authenticated by app BFF)
server {
    listen 8741 ssl;
    listen [::]:8741 ssl;
    server_name 85.137.95.104.sslip.io;

    ssl_certificate /etc/letsencrypt/live/85.137.95.104.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/85.137.95.104.sslip.io/privkey.pem;
    client_max_body_size 2m;

    # Gate endpoints are public (invite flow + Telegram callback + health)
    location /gate/ {
        proxy_pass http://127.0.0.1:8744;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Studio: authenticated via lhc-gate session cookie.
    # The Studio product boundary is loopback-only by design (L01); nginx normalizes
    # Host/Origin to the loopback form so the internal policy accepts proxied traffic.
    # Unauthenticated visitors never reach this block (auth_request below).
    location / {
        auth_request /_gate_check;
        error_page 401 = @gate_login;
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8740;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-LHC-Telegram-Id $auth_telegram_id;
        proxy_set_header X-LHC-Gate-Identity $gate_identity;
        proxy_read_timeout 300s;
    }

    # Studio assets (V00 F01 fix): namespaced /studio-assets/*, honest codes.
    # No error_page override: auth failures stay bare 401, unknown assets 404.
    location /studio-assets/ {
        auth_request /_gate_check;
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8740;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-LHC-Telegram-Id $auth_telegram_id;
        proxy_set_header X-LHC-Gate-Identity $gate_identity;
        proxy_read_timeout 300s;
    }

    # Player page (navigation): unauthenticated visitors get the login page.
    location ~ ^/p/(?<player_id>[A-Za-z0-9_-]+)/?$ {
        auth_request /_gate_check;
        error_page 401 = @gate_login;
        rewrite ^ / break;
        proxy_pass http://127.0.0.1:8745;
        include /etc/nginx/conf.d/lhc-player-proxy.inc;
    }

    # Player assets and runtime API: honest codes, never login HTML with 200 (V00 §2.1.4).
    # No error_page override here: auth failures stay bare 401, unknown assets 404.
    # (rewrite instead of proxy_pass URI part: URIs are illegal in regex locations.)
    location ~ ^/p/[A-Za-z0-9_-]+/(?<player_rest>.+)$ {
        auth_request /_gate_check;
        rewrite ^/p/[A-Za-z0-9_-]+/(.+)$ /$1 break;
        proxy_pass http://127.0.0.1:8745;
        include /etc/nginx/conf.d/lhc-player-proxy.inc;
    }

    location ~ ^/(v1/.+|player-meta\.json|player-lib/.+|contracts-lib/.+|player-assets/.+)$ {
        auth_request /_gate_check;
        proxy_pass http://127.0.0.1:8745;
        include /etc/nginx/conf.d/lhc-player-proxy.inc;
    }

    location = /_gate_check {
        internal;
        proxy_pass http://127.0.0.1:8744/gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        auth_request_set $auth_telegram_id $upstream_http_x_telegram_id;
        # Подписанный ассерт личности из проверенной сессии gate. proxy_set_header
        # перекрывает всё, что прислал браузер, поэтому подделать его снаружи нельзя.
        auth_request_set $gate_identity $upstream_http_x_lhc_gate_identity;
    }

    # Legacy root asset names (V00): gone — canonical paths are
    # /studio-assets/* and /player-assets/*. Never login HTML with 200.
    location = /styles.css { return 410; }
    location = /app.js { return 410; }

    location @gate_login {
        root /var/www/lhc;
        try_files /login.html =503;
    }
}
