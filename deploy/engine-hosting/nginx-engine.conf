# Engine runtime HTTPS endpoint (preview integration target)
server {
    listen 8743 ssl;
    listen [::]:8743 ssl;
    server_name 85.137.95.104.sslip.io;

    ssl_certificate /etc/letsencrypt/live/85.137.95.104.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/85.137.95.104.sslip.io/privkey.pem;

    # Bounded proxy for the Engine runtime API only
    location / {
        proxy_pass http://127.0.0.1:8746;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
}
